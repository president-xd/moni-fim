[package]
name = "moni-fim"
version = "2.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["president-xd"]
description = "Enterprise-grade File Integrity Monitoring (FIM) daemon with cryptographic baselines, real-time inotify/auditd monitoring, and policy enforcement"
license = "MIT"
readme = "README.md"
repository = "https://github.com/president-xd/moni-fim"
homepage = "https://github.com/president-xd/moni-fim"
keywords = ["security", "file-integrity", "monitoring", "audit", "compliance"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["/tests/fixtures", "/.github"]

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Hashing
blake3 = "1.8"
sha2 = "0.10"
md-5 = "0.10"

# Display
colored = "2.2"

# Parallelism
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
simplelog = "0.12"

# Filesystem
walkdir = "2.5"
glob = "0.3"
xattr = "1.5"
inotify = "0.11"

# System
ctrlc = "3.4"
nix = { version = "0.27", features = ["user", "signal", "process"] }
libc = "0.2"
daemonize = "0.5"

# Crypto
ed25519-dalek = "2.1"
rand = "0.8"
base64 = "0.21"

# Compression
zstd = "0.13"

# Parsing
regex = "1.11"
lazy_static = "1.5"
hex = "0.4"
hostname = "0.3"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
