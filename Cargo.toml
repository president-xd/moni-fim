[package]
name = "moni-fim"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "High-performance File Integrity Monitoring tool"
license = "MIT"

[dependencies]
blake3 = "1.5"
sha2 = "0.10"
md-5 = "0.10"
colored = "2.0"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
simplelog = "0.12"
walkdir = "2.4"
crossterm = "0.27"
ctrlc = "3.4"
nix = { version = "0.27", features = ["user"] }
libc = "0.2"
ed25519-dalek = "2.1"
rand = "0.8"
zstd = "0.13"
regex = "1.10"
glob = "0.3"
linux-audit-parser = "0.2"
xattr = "1.2"
base64 = "0.21"
toml = "0.8"
hostname = "0.3"
hex = "0.4"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"